target-version = "py312"
line-length = 120
extend-exclude = ["*.ipynb"]

[lint]
# Tests and package markers are formatted but not linted.
exclude = ["tests/**", "**/__init__.py"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
# One explicit rule set (no split select/extend-select — the effective set was hard to read).
# `PL` already subsumes PLC/PLE/PLR/PLW, so only the umbrella is listed.
select = [
    "A",     # flake8-builtins
    "ANN",   # flake8-annotations
    "ARG",   # flake8-unused-arguments
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "BLE",   # flake8-blind-except
    "C4",    # flake8-comprehensions
    "C90",   # mccabe complexity
    "D",     # pydocstyle
    "E",     # pycodestyle errors
    "ERA",   # eradicate (commented-out code)
    "F",     # pyflakes
    "FBT",   # flake8-boolean-trap
    "FIX",   # flake8-fixme
    "FLY",   # flynt
    "FURB",  # refurb
    "I",     # isort
    "ICN",   # flake8-import-conventions
    "NPY",   # numpy-specific rules
    "PERF",  # perflint
    "PIE",   # flake8-pie
    "PL",    # pylint (PLC/PLE/PLR/PLW)
    "PT",    # flake8-pytest-style
    "PTH",   # flake8-use-pathlib
    "PYI",   # flake8-pyi
    "Q",     # flake8-quotes
    "RET",   # flake8-return
    "RUF",   # ruff-specific rules
    "S",     # flake8-bandit
    "SIM",   # flake8-simplify
    "SLF",   # flake8-self
    "TC",    # flake8-type-checking
    "TRY",   # tryceratops
    "W",     # pycodestyle warnings
    "YTT",   # flake8-2020
]
ignore = ["E402", "E501", "B905", "SIM300", "FBT001", "FBT002", "D100", "ANN401", "SIM117", "D105", "F722", "F821", "TRY003"]
fixable = ["ALL"]
unfixable = ["SIM"]
future-annotations = true

[lint.isort]
force-single-line = true
lines-after-imports = 2
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
known-third-party = []
known-first-party = []
known-local-folder = []

[lint.mccabe]
max-complexity = 10

[lint.pycodestyle]
ignore-overlong-task-comments = true

[lint.pydocstyle]
convention = "google"

[lint.flake8-annotations]
allow-star-arg-any = true
ignore-fully-untyped = false
mypy-init-return = true

[lint.pylint]
max-args = 10
max-branches = 10
max-returns = 5
max-statements = 40
allow-magic-value-types = ["str", "bytes", "complex", "float", "int"]

[lint.per-file-ignores]
# The render adapter is, by design, an extension of the viewer's render internals: it
# reads the viewer's live render settings (model, tau, mode, colormap, background,
# camera model, distortion) directly rather than through a separate state object.
"anycam4d/viewer/render_adapter.py" = ["SLF001"]

# PLR0913: too many arguments in function definition
"anycam4d/cuda/autograd.py" = ["PLR0913"]

[lint.pep8-naming]
ignore-names = ["xxx"]

[lint.flake8-pytest-style]
fixture-parentheses = true
mark-parentheses = true
parametrize-names-type = "tuple"
parametrize-values-row-type = "tuple"
parametrize-values-type = "list"

[format]
skip-magic-trailing-comma = false
quote-style = "double"
