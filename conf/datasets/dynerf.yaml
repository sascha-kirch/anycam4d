# DyNeRF (Meta Neural 3D Video) dataset registry.
# Raw source fetched to the user's own machine (GitHub release); never re-hosted (redistribute:false).
# Canonical model is opencv (Brown-Conrady) from in-process COLMAP SfM + dense MVS.
dataset: dynerf
license:
  redistribute: false
  source: "Meta Neural_3D_Video v1.0"
source_url: "https://github.com/facebookresearch/Neural_3D_Video/releases/download/v1.0"
scenes:
  cook_spinach:
    source_subdir: cook_spinach
    fps: 30
    eval_cams: [0]
    excluded_cams: []
    variants: [native, undistorted]
    scales: [2]  # half; base is always full-res, variants derived at each
  flame_steak:
    source_subdir: flame_steak
    fps: 30
    eval_cams: [0]
    excluded_cams: []
    variants: [native, undistorted]
    scales: [2]  # half; base is always full-res, variants derived at each
  sear_steak:
    source_subdir: sear_steak
    fps: 30
    eval_cams: [0]
    excluded_cams: []
    variants: [native, undistorted]
    scales: [2]  # half; base is always full-res, variants derived at each
  coffee_martini:
    source_subdir: coffee_martini
    fps: 30
    eval_cams: [0]
    excluded_cams: []
    variants: [native, undistorted]
    scales: [2]  # half; base is always full-res, variants derived at each
  cut_roasted_beef:
    source_subdir: cut_roasted_beef
    fps: 30
    eval_cams: [0]
    excluded_cams: []
    variants: [native, undistorted]
    scales: [2]  # half; base is always full-res, variants derived at each
  flame_salmon_1:
    source_subdir: flame_salmon_1_split
    fps: 30
    eval_cams: [0]
    excluded_cams: []
    variants: [native, undistorted]
    scales: [2]  # half; base is always full-res, variants derived at each
    split_parts: 3
    max_frames: 300  # first 300 of 1200 frames, as published
